name: sidepi
description: SIDEPI - identifikasi penyakit tanaman padi untuk petugas lapangan
publish_to: 'none'
version: 0.5.0+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  image: ^4.2.0
  image_picker: ^1.1.2
  tflite_flutter: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/basis-pengetahuan.json
    - assets/models/
    - assets/gejala/
    - assets/detail_penyakit.json
