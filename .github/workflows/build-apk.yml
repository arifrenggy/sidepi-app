name: Bangun APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Info versi
        run: flutter --version

      - name: Baca versi aplikasi
        id: versi
        run: |
          VERSI=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "nilai=$VERSI" >> $GITHUB_OUTPUT

      - name: Siapkan folder android
        run: |
          flutter create --project-name sidepi --org id.go.sumbatimur --platforms android /tmp/scaffold
          cp -r /tmp/scaffold/android .
          sed -i 's/android:label="sidepi"/android:label="SIDEPI"/' android/app/src/main/AndroidManifest.xml
          cat >> android/build.gradle << 'GRADLE'

          // buang library TF yang membuat bentrok namespace; model kita hanya butuh operasi dasar
          subprojects {
              configurations.all {
                  exclude group: 'org.tensorflow', module: 'tensorflow-lite-select-tf-ops'
                  exclude group: 'org.tensorflow', module: 'tensorflow-lite-gpu'
                  resolutionStrategy.eachDependency { d ->
                      if (d.requested.group == 'org.tensorflow' && d.requested.name.startsWith('tensorflow-lite')) {
                          d.useVersion '2.16.1'
                      }
                  }
              }
          }

          // samakan target JVM Java dan Kotlin untuk semua plugin
          subprojects {
              afterEvaluate { proyek ->
                  if (proyek.hasProperty('android')) {
                      proyek.android {
                          compileSdkVersion 36
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                      }
                  }
                  proyek.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                      kotlinOptions { jvmTarget = '17' }
                  }
              }
          }
          GRADLE

      - name: Setelan Gradle
        run: |
          cat >> android/gradle.properties << 'PROPS'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
          org.gradle.parallel=false
          org.gradle.daemon=false
          android.useAndroidX=true
          PROPS

      - name: Ambil dependensi
        run: flutter pub get

      - name: Analisis kode
        run: flutter analyze

      - name: Uji logika
        run: flutter test

      - name: Bangun APK
        run: |
          set +e
          flutter build apk --release > /tmp/build.log 2>&1
          kode=$?
          grep -aiE "error|failed|what went wrong|Execution failed" /tmp/build.log | tail -20
          APK=$(find . -name "app-release.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan"
            tail -30 /tmp/build.log
            exit 1
          fi
          echo "APK ditemukan di: $APK"
          cp "$APK" sidepi-universal.apk
          # versi ringkas untuk HP Android modern (arm64)
          flutter build apk --release --split-per-abi > /tmp/build2.log 2>&1
          ARM=$(find . -name "app-arm64-v8a-release.apk" -type f | head -1)
          if [ -n "$ARM" ]; then cp "$ARM" sidepi-arm64.apk; fi
          ls -la sidepi-*.apk

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: sidepi-apk
          path: sidepi-*.apk
          if-no-files-found: error

      - name: Terbitkan rilis GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versi.outputs.nilai }}
          name: SIDEPI v${{ steps.versi.outputs.nilai }}
          body: |
            Rilis SIDEPI versi ${{ steps.versi.outputs.nilai }}.

            Yang ada di versi ini:
            1. Periksa foto daun dari kamera, hasil keluar di perangkat tanpa internet
            2. Model lima kelas: blas, bercak daun coklat, hawar daun bakteri, tungro, daun sehat
            3. Foto yang bukan tanaman padi ditolak sebelum dianalisis
            4. Hasil menampilkan contoh gambar gejala, deskripsi penyakit, kemungkinan lain yang mirip, dan rekomendasi pengendalian

            Catatan: aplikasi ini alat bantu lapangan, bukan pengganti pemeriksaan penyuluh. Ketepatan model diuji pada foto laboratorium, bukan foto lapangan.
          files: sidepi-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
