name: Bangun APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Info versi
        run: flutter --version

      - name: Siapkan folder android
        run: |
          flutter create --project-name sidepi --org id.go.sumbatimur --platforms android /tmp/scaffold
          cp -r /tmp/scaffold/android .
          sed -i 's/android:label="sidepi"/android:label="SIDEPI"/' android/app/src/main/AndroidManifest.xml

      - name: Ambil dependensi
        run: flutter pub get

      - name: Analisis kode
        run: flutter analyze

      - name: Uji logika
        run: flutter test

      - name: Bangun APK
        run: flutter build apk --release --split-per-abi

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: sidepi-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
