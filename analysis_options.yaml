include: package:flutter_lints/flutter.yaml

# Tampilan SIDEPI disusun dari banyak widget kecil yang bertumpuk.
# Aturan "const" dimatikan karena penanda const pada rantai widget sepanjang itu
# lebih sering mengganggu keterbacaan daripada menghemat waktu render.
linter:
  rules:
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
    prefer_const_declarations: false
    prefer_const_constructors_in_immutables: false
